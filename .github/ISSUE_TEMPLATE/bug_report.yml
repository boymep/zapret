name: 🐛 Проблема
title: '[Проблема] '
description: Сообщить о проблеме
labels: ['type: проблема', 'status: нуждается в сортировке']

body:
  - type: checkboxes
    id: checklist
    attributes:
      label: ⚠️ Чеклист
      description: Перед созданием нового Issue, удостоверьтесь что выполнили следующие пункты
      options:
        - label: Я искал решение проблемы в [README](https://github.com/boymep/zapret/blob/main/README.md) и среди [Issues](https://github.com/boymep/zapret/issues) и [Discussions](https://github.com/boymep/zapret/discussions)
        - label: Я скачал ``zapret`` из [релизов официального репозитория](https://github.com/boymep/zapret/releases)
        - label: Ознакомился с [условиями создания Issue](https://gist.github.com/ShadowCreator-5/aa7e39d647c22139103b4191156e3d31)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Опишите вашу проблему
      description: Чётко опишите проблему с которой вы столкнулись
      placeholder: Описание проблемы
    validations:
      required: true
  
  - type: textarea
    id: providerandregion
    attributes:
      label: Укажите своего провайдера и регион (при желании)
      description: Провайдер и регион на котором вы словили проблему
      placeholder: Провайдер и регион
  
  - type: textarea
    id: version
    attributes:
      label: Версия zapret
      description: Версия zapret на которой вы словили проблему
      placeholder: Версия
    validations:
      required: true

  - type: textarea
    id: additions
    attributes:
      label: Дополнительные детали
      description: Дополнительные детали о которых нам нужно знать
