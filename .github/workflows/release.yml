name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read and verify version
        run: |
          $version = (Get-Content -Raw .service/version.txt).Trim()
          if ($version -notmatch '^\d+(\.\d+)+$') { throw "Invalid version in .service/version.txt: '$version'" }
          $m = Select-String -Path service.bat -Pattern '^set "LOCAL_VERSION=(.*)"\s*$' | Select-Object -First 1
          if (-not $m) { throw 'LOCAL_VERSION not found in service.bat' }
          $local = $m.Matches[0].Groups[1].Value.Trim()
          if ($local -ne $version) { throw "service.bat LOCAL_VERSION '$local' != .service/version.txt '$version'" }
          git fetch --tags --quiet
          if (git tag -l "v$version") { throw "Tag v$version already exists" }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build GUI
        run: |
          if (Test-Path gui/warp.conf) { throw 'gui/warp.conf must not be present in a release build' }
          cmd /c "gui\build.bat"
          if ($LASTEXITCODE -ne 0) { throw "gui\build.bat failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path ZapretGUI.exe)) { throw 'ZapretGUI.exe was not produced' }

      - name: Package
        run: |
          $name = "zapret-$env:VERSION"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item ZapretGUI.exe, service.bat, LICENSE.txt, README.md, README_GUI.md, unlocker.bat $stage
          Copy-Item general*.bat $stage
          foreach ($d in 'bin', 'lists', 'utils') { Copy-Item $d (Join-Path $stage $d) -Recurse }
          Get-ChildItem $stage -Recurse -File -Filter '*-user.txt' | Remove-Item -Force
          $zip = "$name.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n")
          "SHA256=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = "zapret-$env:VERSION.zip"
          $body = @(
            "Zapret core: bol-van/zapret v72.9 (winws), packaged by flowseal/zapret-discord-youtube.",
            "",
            "SHA256 ($zip):",
            '```',
            "$env:SHA256",
            '```'
          )
          if (Test-Path .github/RELEASE_NOTES.md) { $body += @("", (Get-Content -Raw .github/RELEASE_NOTES.md)) }
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -Path $notes -Value ($body -join "`n") -Encoding utf8
          gh release create "v$env:VERSION" $zip "$zip.sha256" --title "zapret $env:VERSION" --notes-file $notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
